# Bridge Advanced (tvbridge-admin): Flatten now tokens only (tvbridge 1.1.3 /manual route).
# manual-a.env / manual-b.env (0600) hold TVBRIDGE_MANUAL_TOKEN_A / _B, which open nothing but
# POST /manual/<token>/<key>/flatten. Never tvbridge.env, firing.env or any order token.
[Service]
EnvironmentFile=-%h/.local/share/decrypt-os/tvbridge/logins/manual-a.env
EnvironmentFile=-%h/.local/share/decrypt-os/tvbridge/logins/manual-b.env
