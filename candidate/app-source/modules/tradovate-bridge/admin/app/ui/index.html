<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge Advanced</title>
<style>
:root{color-scheme:dark;--bg:#0b0910;--bg-1:#110e16;--bg-2:#18131f;--line:#26202e;--line-2:#3a3044;--ink:#fff5eb;--ink-2:#cfc1b3;--ink-3:#8b7f76;--ink-4:#5e554f;--amber:#ff9f43;--purple:#c56cf0;--coral:#ff6b81;--font:'Space Grotesk','Adwaita Sans','Noto Sans',system-ui,sans-serif;--mono:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',ui-monospace,monospace}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;font:14px/1.4 var(--font);color:var(--ink);background:var(--bg);min-width:960px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}
.hidden{display:none!important}
/* layout */
main{max-width:1800px;margin:0 auto;padding:0 22px 24px;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,26vw,420px);column-gap:32px;align-items:start}
.top,.strip,.drift{grid-column:1/-1}
.side{position:sticky;top:0;max-height:100vh;overflow:auto;padding-bottom:20px}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);min-width:0;flex-wrap:wrap}
.brand b{color:var(--ink);font-weight:600;white-space:nowrap;font-size:13px}
.brand i{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--amber),var(--coral) 60%,var(--purple));display:inline-block;flex:none}
.badge{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:none;color:var(--amber);border:1px solid var(--amber);padding:4px 8px;border-radius:3px;white-space:nowrap}
.tools{display:flex;gap:8px;flex:none}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:9px 0;border-bottom:1px solid var(--line);font:12px/1.3 var(--mono);color:var(--ink-3)}
.strip .mkt{color:var(--ink-2)}.strip .mkt.open{color:var(--ink)}
.strip .hold{color:var(--amber)}
.strip .feed.bad{color:var(--coral)}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}
.stale .clock .dot{background:var(--coral)}.stale .clock{color:var(--coral)}
@media (prefers-reduced-motion:no-preference){.live .clock .dot{animation:pulse 3s ease-out infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,245,235,.45)}70%{box-shadow:0 0 0 7px rgba(255,245,235,0)}100%{box-shadow:0 0 0 0 rgba(255,245,235,0)}}
.drift{margin:0;padding:8px 12px;list-style:none;border-left:3px solid var(--amber);background:var(--bg-1);font-size:13px;color:var(--ink-2)}
.drift:empty{display:none}
.stale .col,.stale .side{opacity:.55}
/* needs a person (red, top of page) */
.needs{grid-column:1/-1;margin:10px 0 0;padding:10px 14px;border:1px solid var(--coral);border-left-width:3px;border-radius:6px;background:rgba(255,107,129,.08);display:grid;gap:8px}
.needs .nh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.needs .nh span{font-size:13px;color:var(--ink-2)}
.needs ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.needs li{display:grid;gap:3px;font-size:13px;color:var(--ink-2)}
.needs .ns{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--ink);font-weight:500}
.needs .ns time{font:11px var(--mono);color:var(--ink-3)}
.nf{color:var(--coral);font-weight:600}
.nu{font:11.5px var(--mono);color:var(--ink-3);overflow-wrap:anywhere}
.db .warn-box{border:1px solid var(--amber);border-radius:6px;padding:10px 12px;color:var(--amber);font-size:13.5px}
.db .warn-box b{color:var(--amber)}
.result .lead{font-size:14px}
/* restart log */
.log{list-style:none;margin:0;padding:0;display:grid;gap:3px;font:11.5px/1.4 var(--mono);color:var(--ink-3)}
.log li{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.log li.ph{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin-top:4px}
.log .u{color:var(--ink-2)}
.log .w{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.log .w.bad{color:var(--coral)}.log .w.warn{color:var(--amber)}.log .w.dim{color:var(--ink-4)}
.log .d{flex:1 1 100%;overflow-wrap:anywhere}
.pend details{font-size:12px;color:var(--ink-3)}.pend summary{cursor:pointer}.pend details>*:not(summary){margin-top:4px}
.pend .pn{font-size:12px;color:var(--ink-2)}
.db .steps{padding:0;list-style:none;font:11.5px/1.5 var(--mono);color:var(--ink-3)}
/* sections */
section{padding:14px 0 12px;border-bottom:1px solid var(--line);min-width:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px}
.sh h2{margin:0;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.sh .r{font:12px/1 var(--mono);color:var(--ink-3)}
.lh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 4px}
.lh h3{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
.lh .acts{margin-left:auto}
.meta{margin:0 0 8px;font:12px/1.5 var(--mono);color:var(--ink-3)}
.meta b{color:var(--ink-2);font-weight:500}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;margin:0 0 8px;font:12px/1.3 var(--mono)}
.kv dt{color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.kv dd{margin:0;display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.notes{margin:0 0 8px;padding:0;list-style:none;font-size:12.5px;color:var(--ink-3)}
.warn{color:var(--amber)}.bad{color:var(--coral)}.info{color:var(--purple)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.pill.amber{color:var(--amber)}.pill.amber i{background:var(--amber)}
.pill.coral{color:var(--coral)}.pill.coral i{background:var(--coral)}
.pill.purple{color:var(--purple)}.pill.purple i{background:var(--purple)}
.pill.dim{color:var(--ink-3)}.pill.dim i{background:none;border:1.5px solid var(--ink-4)}
.tag{font:600 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.tag.amber{color:var(--amber)}.tag.coral{color:var(--coral);background:rgba(255,107,129,.12)}.tag.purple{color:var(--purple)}.tag.dim{color:var(--ink-3)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-2);border-radius:4px;background:transparent;color:var(--ink-2);font:500 12px/1.2 var(--font);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg-2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1008;font-weight:600}
.btn.primary:hover{background:#ffb168}
.btn.danger{color:var(--coral);border-color:var(--coral)}
.btn.danger:hover{background:rgba(255,107,129,.12)}
.btn.danger.primary{background:var(--coral);color:#1a0a0e}
.btn.sm{padding:2px 7px;font-size:11px}
.btn.copy{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px}
.linkish{background:none;border:0;padding:0;color:var(--amber);cursor:pointer;text-decoration:underline;font-size:12.5px}
/* menu */
.menu{position:relative;display:inline-block}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu ul{position:absolute;right:0;top:calc(100% + 4px);z-index:5;margin:0;padding:4px;list-style:none;min-width:150px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu ul button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;background:none;border-radius:4px;color:var(--ink-2);cursor:pointer;font-size:12.5px}
.menu ul button:hover:not(:disabled){background:var(--bg-1);color:var(--ink)}
.menu ul button:disabled{opacity:.4;cursor:not-allowed}
/* cards */
.cards{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-height:34px;border-radius:6px}
.cards.over{outline:1px dashed var(--amber);outline-offset:3px}
.cards .empty{padding:8px 12px;font-size:13px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:6px}
.card{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;padding:9px 12px 9px 8px;background:var(--bg-1);border:1px solid var(--line);border-radius:6px;position:relative}
.card.leader{grid-template-columns:minmax(0,1fr);padding-left:14px;border-left:3px solid var(--amber)}
.card.dragging{opacity:.4}
.card.before::before{content:'';position:absolute;left:0;right:0;top:-4px;height:2px;background:var(--amber)}
.cards.end::after{content:'';display:block;height:2px;background:var(--amber);margin-top:-4px}
.card>:not(.handle){grid-column:2}.card.leader>*{grid-column:1}
.handle{grid-row:1/span 4;align-self:center;width:22px;height:34px;border:0;background:none;color:var(--ink-4);cursor:grab;font:700 16px/1 var(--mono);letter-spacing:-.2em;padding:0}
.handle:hover{color:var(--ink-2)}
.card .ct{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card .ct b{font-size:15px;font-weight:600}
.card .role{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.card .sub{font:11.5px/1.4 var(--mono);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 10px}
.card .sub .pos{color:var(--ink-2)}
.card .sub .off{color:var(--purple)}
.card .pause{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.card .acts .sp{flex:1 1 40px}
/* side */
.side section:first-child{padding-top:14px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pend{padding:8px 10px 8px 12px;border-left:3px solid var(--line-2);background:var(--bg-1);border-radius:0 6px 6px 0;font-size:13px;display:grid;gap:4px}
.pend.amber{border-left-color:var(--amber)}.pend.coral{border-left-color:var(--coral)}.pend.purple{border-left-color:var(--purple)}.pend.ok{border-left-color:var(--ink)}
.pend .pt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pend time{font:11px var(--mono);color:var(--ink-3)}
.pend .ps{color:var(--ink);font-weight:500}
.pend .pe{font-size:12px;color:var(--ink-3)}
.pend .pe b{color:var(--amber);font-weight:500}
.pend .pa{display:flex;gap:6px;margin-top:2px}
.pend.empty{display:block;color:var(--ink-3);border-left-color:var(--line)}
/* dialog */
dialog{background:var(--bg-1);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:0;width:min(720px,92vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px;font-weight:600}
.dh .x{border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.db{padding:14px 18px 18px;display:grid;gap:12px;overflow:auto;max-height:calc(90vh - 56px)}
.db p{margin:0}.fb{display:grid;gap:12px}
.db h4{margin:0 0 4px;font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.db ul,.db ol{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13px;color:var(--ink-2)}
.db ul.plain{padding:0;list-style:none}
.db .lead{font-size:15px;font-weight:500}
.db .danger-box{border:1px solid var(--coral);border-radius:6px;padding:10px 12px;color:var(--coral);font-size:13.5px}
.db .quiet{font-size:12.5px;color:var(--ink-3)}
.db details{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.db summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
pre{margin:6px 0 0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2);max-height:220px;overflow:auto}
.gen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font:12.5px var(--mono)}
.gen dt{color:var(--ink-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em}.gen dd{margin:0;overflow-wrap:anywhere;color:var(--ink)}
.field{display:grid;gap:4px;font-size:13px}
.field>span{color:var(--ink-3);font-size:12px}
.field input,.field select,.field textarea{font:13px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:4px;padding:6px 8px;width:100%}
.field input.mono{font-family:var(--mono)}
.field .hint{font-size:12px;color:var(--ink-3)}.field .hint.bad{color:var(--coral)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.choices label{display:flex;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-size:13px;cursor:pointer}
.choices label.off{opacity:.5;cursor:not-allowed}
.choices .m{font:12px var(--mono);color:var(--ink-3);margin-left:auto}
.dfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding-top:4px}
.dfoot .st{margin-right:auto;font-size:12.5px;color:var(--ink-3)}
.result{border-left:3px solid var(--line-2);padding:8px 12px;background:var(--bg-2);display:grid;gap:4px;font-size:13px}
.result.ok{border-left-color:var(--ink)}.result.amber{border-left-color:var(--amber)}.result.bad{border-left-color:var(--coral)}
table.hist{border-collapse:collapse;width:100%;font-size:12.5px}
.hist th{text-align:left;font:500 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 6px 0}
.hist td{padding:6px 8px 6px 0;border-top:1px solid var(--line);vertical-align:top}
.hist td.t{font:11.5px var(--mono);color:var(--ink-3);white-space:nowrap}
.notoken{padding:40px 22px;font-size:16px;color:var(--ink-2)}
/* logins */
.lgs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lgs .empty{padding:8px 12px;font-size:13px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:6px}
.lg{display:grid;gap:4px;padding:9px 12px;background:var(--bg-1);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:6px}
.lg.await{border-left-color:var(--amber);background:rgba(255,159,67,.06)}
.lg .ct{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lg .ct b{font-size:15px;font-weight:600}
.lg .sub{font:11.5px/1.4 var(--mono);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 10px}
.lg .st{font-size:13px;color:var(--ink-2)}.lg .st.await{color:var(--amber)}
.lg .acts{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px}
.lg .acts .hint{font-size:12px;color:var(--ink-3)}
.lg details{font-size:12px;color:var(--ink-3)}.lg summary{cursor:pointer;width:max-content}
.lg .units{list-style:none;margin:4px 0 0;padding:0;font:11.5px/1.5 var(--mono);display:grid;gap:2px;color:var(--ink-2)}
.lg .units .off{color:var(--ink-4)}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.lg.bad{border-left-color:var(--coral);background:rgba(255,107,129,.06)}
.lg .st.ok{color:var(--ink)}.lg .st.warn{color:var(--amber)}.lg .st.bad{color:var(--coral)}
.lg .st.quiet,.lg .blk{font-size:12.5px;color:var(--ink-3)}
/* coming soon: a chip, never a button that refuses */
.soon{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:3px;padding:3px 7px;white-space:nowrap;cursor:help}
.soon-text{font-size:12.5px;color:var(--ink-3)}
.pill.off{color:var(--ink-3)}.pill.off i{background:var(--ink-4)}
.kv .na{color:var(--ink-3)}
.kv .inactive{color:var(--ink-3)}
/* page footer: export */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 0 6px;font-size:12.5px;color:var(--ink-3)}
.foot .st{color:var(--ink-2)}
/* login preview: files, units, tokens */
.frows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font:11.5px/1.5 var(--mono);color:var(--ink-2)}
.frows .a{color:var(--ink-3);text-transform:uppercase;font-size:10px;letter-spacing:.08em;padding-top:2px;white-space:nowrap}
.frows .by{grid-column:1/-1;font:500 12px/1.2 var(--font);color:var(--ink-3);margin:6px 0 1px}
.frows .by:first-child{margin-top:0}
.frows .d{color:var(--ink-3);font-family:var(--font);font-size:12px}
.frows details{border:0;padding:0;margin-top:2px}.frows summary{font-size:11.5px;color:var(--ink-3)}
.db .steps li.run{color:var(--amber)}.db .steps li.todo{color:var(--ink-4)}
.db .warn-box.hold b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<main id="main">
  <header class="top">
    <div class="brand"><i></i><b>Bridge Advanced</b><span id="badge" class="badge hidden">Sandbox — changes go to a test copy, nothing live</span></div>
    <div class="tools">
      <button class="btn" id="b-addwh">Add webhook</button>
      <button class="btn" id="b-addacc">Add account</button>
      <button class="btn" id="b-addlogin">Add login</button>
      <button class="btn" id="b-hist">History</button>
    </div>
  </header>
  <div class="strip" id="strip"></div>
  <div class="needs hidden" id="needs" role="region" aria-label="Needs a person" aria-live="polite"></div>
  <ul class="drift" id="drift"></ul>
  <div class="col" id="col">
    <div id="webhooks"></div>
    <section id="unassigned">
      <div class="sh"><h2>Not assigned</h2><span class="r">Drop a follower here to take it off its webhook</span></div>
      <ol class="cards" id="unassigned-list" data-wh=""></ol>
    </section>
    <section id="logins">
      <div class="sh"><h2>Logins</h2><span class="r">Tradovate logins the bridge runs. Each has its own window.</span></div>
      <ol class="lgs" id="logins-list"></ol>
      <div class="lfoot" id="logins-foot"></div>
    </section>
    <footer class="foot" id="foot"></footer>
  </div>
  <aside class="side">
    <section>
      <div class="sh"><h2>Pending changes</h2><span class="r" id="pend-count"></span></div>
      <ol class="plist" id="pending" aria-live="polite" aria-relevant="additions text"></ol>
    </section>
    <section>
      <div class="sh"><h2>Recent</h2></div>
      <ol class="plist" id="recent"></ol>
    </section>
  </aside>
</main>
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dh"><h2 id="dlg-title"></h2><button class="x" id="dlg-x" aria-label="Close">×</button></div>
  <div class="db" id="dlg-body"></div>
</dialog>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='dataset')Object.assign(el.dataset,v);else el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:String(c))}return el}

/* Outcome of a change: [pill label, tone, sentence]. A failed change is one of three things:

/* ---------- API ---------- */
async function api(path,body){
  if(S.mock)return MOCK.call(path,body);
  const opt={headers:{'X-Admin-Token':S.token||''}};
  if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  const r=await fetch(path,opt);let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const err=new Error((j&&j.detail)||('Request failed (HTTP '+r.status+')'));err.code=j&&j.error;err.status=r.status;throw err}
  return j;
}
async function poll(){
  try{S.data=await api('/api/overview');S.lastOk=Date.now();S.err=null}
  catch(e){S.err=e.message}
  renderStrip();if(S.data)renderAll();
  if(S.watch&&S.data){const c=findChange(S.watch.id);if(c)S.watch.update(c)}   // live progress in an open confirm dialog
}

/* ---------- header ---------- */
function renderStrip(){
  const d=S.data,age=(Date.now()-S.lastOk)/1000,stale=!!S.err||age>10;
  document.body.classList.toggle('stale',stale);document.body.classList.toggle('live',!stale);
  const st=$('#strip');st.replaceChildren();
  if(d){
    $('#badge').classList.toggle('hidden',d.mode!=='sandbox');
    st.append(h('span',{class:'mkt '+d.market.state},'Market '+d.market.state+(d.market.reason?' · '+d.market.reason:'')));
    if(d.market.weekend_hold)st.append(h('span',{class:'hold'},d.market.weekend_hold_text||'Weekend login hold is on.'));
    st.append(h('span',{class:'feed'+(d.status_source.ok?'':' bad')},d.status_source.ok?'Position feed ok · '+Math.round(d.status_source.age_s)+' s':'Position feed down: '+(d.status_source.error||'flat checks are blocked')));
    if(d.restarter)st.append(h('span',{class:'mode'},'Restarts: '+(d.restarter==='systemd'?'live':d.restarter==='simulated'?'simulated':d.restarter)));
  }
  const when=S.lastOk?fmtT(S.lastOk/1000):'never';
  st.append(h('span',{class:'clock',role:'status'},h('i',{class:'dot'}),S.err?'Offline · '+S.err+' · last update '+when:stale?'Stale · last update '+when:'Updated '+when));
}

/* ---------- main render ---------- */
function renderAll(){
  const d=S.data,key=JSON.stringify({...d,generated_at:0,status_source:0});
  if(key===S.key)return;

  S.key=key;
  renderNeeds(d.needs_person||[]);
  $('#drift').replaceChildren(...d.drift.map(t=>h('li',null,t)));
  $('#webhooks').replaceChildren(...d.webhooks.map(webhookSection));
  const un=d.accounts.filter(a=>!a.webhook);
  fillList($('#unassigned-list'),un.map(a=>card(a,null)),'No unassigned accounts.');
  renderLogins(d);
  renderHeaderAndFoot(d);
  const open=new Set([...document.querySelectorAll('.side details[open]')].map(x=>x.dataset.id));   // keep opened step lists open across polls
  const pend=$('#pending');
  fillList(pend,d.pending.map(changeItem),'Nothing pending.');
  $('#pend-count').textContent=d.pending.length?d.pending.length+' open':'';

/* GET /api/export needs the token header, so a plain link can't do it: fetch, then save the blob under the server's file name. */
async function exportFlow(){
  const st=$('#export-st');if(st)st.textContent='Preparing…';
  try{
    let blob,name;
    if(S.mock){const r=await api('/api/export');name=r.name;blob=new Blob(['mock export, not a real archive\n'],{type:'application/gzip'})}
    else{const r=await fetch((S.data.export||{}).url||'/api/export',{headers:{'X-Admin-Token':S.token||''}});
      if(!r.ok){let j=null;try{j=await r.json()}catch(e){}throw new Error((j&&j.detail)||'Export failed (HTTP '+r.status+')')}
      const m=/filename="?([^";]+)"?/.exec(r.headers.get('Content-Disposition')||'');name=m?m[1]:'bridge-setup.tar.gz';blob=await r.blob()}
    const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);

    poll();
  });
  body.append(h('div',{class:'dfoot'},st,cancel,confirm));

async function claimToken(code){
  /* The launcher's one-time code (never the token itself) is traded for the token once. */
  try{const r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    if(r.ok){const j=await r.json();if(j&&j.token)sessionStorage.setItem('adminToken',j.token)}}catch(e){}
}
async function boot(){
  const q=new URLSearchParams(location.search);S.mock=q.get('mock')==='1';
  const c=/[#&]c=([^&]+)/.exec(location.hash);
  if(c){history.replaceState(null,'',location.pathname+location.search);await claimToken(decodeURIComponent(c[1]))}
  const m=/[#&]t=([^&]+)/.exec(location.hash);
  if(m){sessionStorage.setItem('adminToken',decodeURIComponent(m[1]));history.replaceState(null,'',location.pathname+location.search)}
  S.token=sessionStorage.getItem('adminToken');
  if(!S.token&&!S.mock){document.body.replaceChildren(h('p',{class:'notoken'},'Open this page from the Bridge Advanced launcher.'));return}

}
