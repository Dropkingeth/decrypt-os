# Builder VM for build/build.sh:  limactl create --name decrypt-builder factory/builder/lima-builder.yaml
# Then inside it: sudo apt-get install -y qemu-utils btrfs-progs dosfstools python3
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
cpus: 4
memory: 8GiB
disk: 80GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc
mounts: []
containerd:
  user: false
  system: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    guestPortRange: [1, 65535]
    ignore: true
hostResolver:
  enabled: false
dns: [1.1.1.1, 8.8.8.8]
