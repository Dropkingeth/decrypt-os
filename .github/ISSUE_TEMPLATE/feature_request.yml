name: Feature request
description: Suggest an improvement or a new capability for Decrypt OS.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Trading strategies themselves are not part of this repository (see
        `README.md`) -- this is for the OS, desktop, bridge/engine
        infrastructure, assistant and tooling around them. Please use
        synthetic/placeholder values -- never real account numbers, broker
        credentials, tokens or passwords.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that is currently hard, slow or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Sketches, examples and alternatives you considered are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds
      description: Anything you're already doing instead, and why it isn't enough.
